<div class="container mt-4">
  <h3 class="mb-3">Liste des musiciens</h3>

  <div class="row g-2 mb-3">
    <div class="col-md-5">
      <input type="text" class="form-control" placeholder="Rechercher par nom" name="nomRecherche"
        [(ngModel)]="nomRecherche" (ngModelChange)="appliquerFiltres()">
    </div>
    <div class="col-md-4">
      <select class="form-select" name="idGenreRecherche" [(ngModel)]="idGenreRecherche"
        (ngModelChange)="appliquerFiltres()">
        <option [ngValue]="0">Tous les genres</option>
        @for (g of genres; track g.idGenre) {
          <option [ngValue]="g.idGenre">{{ g.nomGenre }}</option>
        }
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-secondary w-100" (click)="reinitialiser()">Réinitialiser</button>
    </div>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Instrument</th>
        <th>Date de naissance</th>
        <th>Genre</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (m of musicians; track m.idMusician) {
        <tr>
          <td>{{ m.idMusician }}</td>
          <td>{{ m.nom }}</td>
          <td>{{ m.instrument }}</td>
          <td>{{ m.dateNaissance | date: 'dd/MM/yyyy' }}</td>
          <td>{{ m.genre?.nomGenre }}</td>
          <td>
            <a class="btn btn-success btn-sm me-2" [routerLink]="['/updateMusician', m.idMusician]">Modifier</a>
            <button class="btn btn-danger btn-sm" (click)="supprimerMusician(m)">Supprimer</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center">Aucun musicien trouvé</td>
        </tr>
      }
    </tbody>
  </table>
</div>
